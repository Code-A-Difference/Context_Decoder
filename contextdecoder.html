        .meaning-section:last-child { border-bottom: none; }

        .meaning-section.contextual { background-color: var(--accent-context); border-left: 4px solid #38a169; }

</head>

        </div>
        <div class="meaning-section contextual">

            <div id="resExample" class="example-box"></div>

    function decodePhrase() {
        const input = document.getElementById('phraseInput').value.trim();
        if (!input) return;

        // Clean input punctuation and spacing for flexible matching
        const lowerInput = input.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"").replace(/\s+/g, ' ');
        let literalMeaning = `The phrase describes the physical items or literal words: "${input}".`;
        let contextualMeaning = "No special idiom matched. This sentence likely means exactly what the literal words say, or it might require asking the speaker for clarification.";
        let usageType = "Direct Context";
        let exampleText = "";
        let found = false;

        // Scan database for a match
        for (let entry of idiomDatabase) {
            const cleanIdiom = entry.idiom.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"");
            if (lowerInput.includes(cleanIdiom) || cleanIdiom.includes(lowerInput)) {
                contextualMeaning = entry.meaning;
                usageType = entry.usage;
                literalMeaning = `The sentence incorporates the expression construct: "${entry.idiom}".`;
                if (entry.example) {
                    exampleText = `<strong>Example:</strong> ${entry.example}`;
                }
                found = true;
                break;
            }
        }

        // Output results to screen instantly
        document.getElementById('resPhrase').innerText = `"${input}"`;
        document.getElementById('resUsage').innerText = usageType;
        document.getElementById('resLiteral').innerText = literalMeaning;
        document.getElementById('resContextual').innerText = contextualMeaning;
        
        const exBox = document.getElementById('resExample');
        if (exampleText) {
            exBox.innerHTML = exampleText;
            exBox.style.display = "block";
        } else {
            exBox.style.display = "none";
        }

        document.getElementById('resultCard').style.display = "block";
    }

    // Bind Enter key trigger
    document.getElementById('phraseInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') decodePhrase();
    });
